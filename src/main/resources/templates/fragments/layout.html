<!DOCTYPE html>
<html th:fragment="page(title, crumb, nav, content)" xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:replace="~{fragments/head :: head(${title})}"></head>
<body>
<div class="backdrop" data-backdrop data-sidebar-toggle></div>
<div class="app">
    <aside th:replace="~{fragments/sidebar :: sidebar(${nav})}"></aside>
    <div class="shell">
        <header th:replace="~{fragments/navbar :: navbar(${title}, ${crumb})}"></header>
        <main class="content">
            <div th:replace="~{fragments/alerts :: alerts}"></div>
            <th:block th:replace="${content}"/>
        </main>
        <p th:replace="~{fragments/footer :: footer}"></p>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/forms.js}"></script>
<script th:src="@{/js/parking-map.js}"></script>
</body>
</html>
